<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Transcripe is a 100% local, private file conversion studio — Whisper transcription, PDF tools, OCR, media download, image, data, archive, and 3D engines."
    />
    <meta name="theme-color" content="#121316" />
    <title>Transcripe — every file, quietly transformed</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Applied before first paint so a chosen dark theme never flashes white. -->
    <script>
      try {
        var t = localStorage.getItem("transcripe.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", t === "dark" ? "#121316" : "#f7f7f9");
        } else if (matchMedia("(prefers-color-scheme: light)").matches) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f7f7f9");
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
